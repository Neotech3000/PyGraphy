<svg xmlns="http://www.w3.org/2000/svg" width="256" height="256" viewBox="0 0 256 256" role="img" aria-label="PyGraphy small icon">
  <title>PyGraphy</title>
  <desc>Simplified PyGraphy icon for 16 to 48 pixels: no grid, heavier shapes, one data point.</desc>
  <defs>
    <linearGradient id="pg-bg-s" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1f1f"/>
      <stop offset="1" stop-color="#140e0e"/>
    </linearGradient>
    <linearGradient id="pg-ink-s" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b3c1ec"/>
      <stop offset="0.5" stop-color="#7b8fc9"/>
      <stop offset="1" stop-color="#5a6ba2"/>
    </linearGradient>
    <linearGradient id="pg-amber-s" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f2c58c"/>
      <stop offset="1" stop-color="#d98f4a"/>
    </linearGradient>
    <clipPath id="pg-clip-s">
      <rect width="256" height="256" rx="56"/>
    </clipPath>
  </defs>

  <rect width="256" height="256" rx="56" fill="url(#pg-bg-s)"/>
  <rect x="1" y="1" width="254" height="254" rx="55" fill="none" stroke="#ffffff" stroke-opacity="0.09" stroke-width="2"/>

  <g clip-path="url(#pg-clip-s)">
    <g transform="translate(128 128) scale(1.2) translate(-128 -128)">
      <rect x="73" y="63" width="30" height="130" rx="15" fill="url(#pg-ink-s)"/>
      <path d="M103 78 C146 78 169 88 169 107 C169 126 146 136 103 136"
            fill="none" stroke="url(#pg-ink-s)" stroke-width="28" stroke-linecap="round"/>
      <circle cx="169" cy="107" r="8" fill="url(#pg-amber-s)"/>
    </g>
  </g>
</svg>
