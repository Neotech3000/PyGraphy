         cy="370"
         r="17"
         fill="#e9e6f2"
         opacity="0.92"
         id="circle20" />
      <circle
         cx="608"
         cy="486"
         r="17"
         fill="#e9e6f2"
         opacity="0.92"
         id="circle21" />
      <circle
