<svg xmlns="http://www.w3.org/2000/svg" width="1024" height="1024" viewBox="0 0 1024 1024" role="img" aria-label="PyGraphy app icon">
  <title>PyGraphy</title>
  <desc>A periwinkle letter P whose bowl is a plotted curve with a single amber data point, on a warm near-black rounded square.</desc>
  <defs>
    <linearGradient id="pg-bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2b1f1f"/>
      <stop offset="0.55" stop-color="#1b1313"/>
      <stop offset="1" stop-color="#110b0b"/>
    </linearGradient>

    <radialGradient id="pg-glow" cx="0.3" cy="0.22" r="0.78">
      <stop offset="0" stop-color="#7b8fc9" stop-opacity="0.32"/>
      <stop offset="0.5" stop-color="#7b8fc9" stop-opacity="0.08"/>
      <stop offset="1" stop-color="#7b8fc9" stop-opacity="0"/>
    </radialGradient>

    <linearGradient id="pg-ink" x1="0.15" y1="0" x2="0.9" y2="1">
      <stop offset="0" stop-color="#b3c1ec"/>
      <stop offset="0.45" stop-color="#7b8fc9"/>
      <stop offset="1" stop-color="#57689f"/>
    </linearGradient>

    <linearGradient id="pg-amber" x1="0" y1="0" x2="0.6" y2="1">
      <stop offset="0" stop-color="#f2c58c"/>
      <stop offset="1" stop-color="#d98f4a"/>
    </linearGradient>

    <radialGradient id="pg-amber-glow" cx="0.5" cy="0.5" r="0.5">
      <stop offset="0" stop-color="#e0a35c" stop-opacity="0.55"/>
      <stop offset="0.55" stop-color="#e0a35c" stop-opacity="0.16"/>
      <stop offset="1" stop-color="#e0a35c" stop-opacity="0"/>
    </radialGradient>

    <pattern id="pg-grid" width="64" height="64" patternUnits="userSpaceOnUse" x="0" y="0">
      <path d="M64 0H0V64" fill="none" stroke="#7b8fc9" stroke-opacity="0.055" stroke-width="2"/>
    </pattern>

    <filter id="pg-shadow" x="-30%" y="-30%" width="160%" height="170%">
      <feDropShadow dx="0" dy="20" stdDeviation="24" flood-color="#000000" flood-opacity="0.55"/>
    </filter>

    <clipPath id="pg-clip">
      <rect width="1024" height="1024" rx="224"/>
    </clipPath>
  </defs>

  <rect width="1024" height="1024" rx="224" fill="url(#pg-bg)"/>

  <g clip-path="url(#pg-clip)">
    <rect width="1024" height="1024" fill="url(#pg-glow)"/>
    <rect width="1024" height="1024" fill="url(#pg-grid)"/>
    <circle cx="830" cy="880" r="300" fill="#7b8fc9" opacity="0.045"/>
  </g>

  <rect x="3" y="3" width="1018" height="1018" rx="221" fill="none" stroke="#ffffff" stroke-opacity="0.07" stroke-width="6"/>

  <!-- Letter P: stem + plotted bowl. Scaled 1.2× around the centre so the
       mark holds its own on app-icon tiles and at small sizes. -->
  <g transform="translate(512 512) scale(1.2) translate(-512 -512)">
    <g filter="url(#pg-shadow)">
      <rect x="293" y="252" width="118" height="520" rx="59" fill="url(#pg-ink)"/>
      <path d="M411 311 C585 311 675 352 675 428 C675 504 585 545 411 545"
            fill="none" stroke="url(#pg-ink)" stroke-width="112" stroke-linecap="round"/>
    </g>

    <!-- Soft sheen down the stem -->
    <rect x="313" y="276" width="20" height="472" rx="10" fill="#ffffff" opacity="0.16"/>

    <!-- Plotted points along the bowl -->
    <circle cx="608" cy="370" r="17" fill="#e9e6f2" opacity="0.92"/>
    <circle cx="608" cy="486" r="17" fill="#e9e6f2" opacity="0.92"/>

    <circle cx="675" cy="428" r="86" fill="url(#pg-amber-glow)"/>
    <circle cx="675" cy="428" r="30" fill="url(#pg-amber)"/>
  </g>
</svg>
