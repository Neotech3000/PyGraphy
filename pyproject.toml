[project]
name = "pygraphy"
version = "0.1.0"
description = "A PyQt6 graphing application"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6"]

[project.gui-scripts]
pygraphy = "main:main"

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main"]

[tool.ruff]
line-length = 100
