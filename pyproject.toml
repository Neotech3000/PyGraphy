[project]
name = "pygraphy"
version = "0.1.0"
description = "A PyQt6 graphing application"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6", "pyqtgraph>=0.14", "openpyxl>=3.1", "odfpy>=1.4"]

# gui-scripts creates a pygraphy command on Linux, macOS, and Windows.
# On Windows that command is pygraphy.exe and it does not open a console.
# This is not one binary that runs on every operating system.
[project.gui-scripts]
pygraphy = "main:main"

# requirements.txt pins the exact versions that were tested. The list above
# says the lowest versions that work, so a fresh install can pick up newer
# ones. Both files are kept on purpose: one is a floor, the other is a
# repeatable environment. Install the pins with
# "pip install -r requirements.txt" when you want the tested set.
[project.optional-dependencies]
dev = ["pytest>=8"]

[tool.setuptools.data-files]
"share/pygraphy" = [
    "sample_data.csv",
    "example_lake.csv",
    "example_stairs.csv",
    "example_cities.csv",
    "example_quiz.csv",
    "example_trails.csv",
    "example_plants.csv",
    "example_rain.csv",
    "example_temperature.csv",
    "example_tide.csv",
    "example_snacks.csv",
    "style.qss",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "appearance", "dataset", "graph_view", "serial_panel"]

[tool.ruff]
line-length = 100
