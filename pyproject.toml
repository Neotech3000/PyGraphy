[project]
name = "pygraphy"
version = "0.1.0"
description = "A PyQt6 graphing application"
requires-python = ">=3.10"
dependencies = ["PyQt6>=6.6", "pyqtgraph>=0.14", "openpyxl>=3.1", "odfpy>=1.4"]

# gui-scripts creates a pygraphy command on Linux, macOS, and Windows.
# On Windows that command is pygraphy.exe and it does not open a console.
# This is not one binary that runs on every operating system.
[project.gui-scripts]
pygraphy = "main:main"

[tool.setuptools.data-files]
"share/pygraphy" = [
    "sample_data.csv",
    "example_lake.csv",
    "example_stairs.csv",
    "example_cities.csv",
    "example_quiz.csv",
    "example_trails.csv",
    "example_plants.csv",
    "example_rain.csv",
    "example_temperature.csv",
    "example_tide.csv",
    "example_snacks.csv",
    "style.qss",
    "assets/logo/pygraphy-icon.svg",
    "assets/logo/pygraphy-icon-256.png",
]

[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[tool.setuptools]
py-modules = ["main", "appearance", "dataset", "graph_view", "serial_panel"]

[tool.ruff]
line-length = 100
